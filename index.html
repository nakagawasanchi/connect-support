<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>機器接続サポート</title>
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body>

  <!-- LINE外アクセス時のゲート -->
  <section id="gate" class="hidden">
    <div id="gate-card">
      <p class="gate-icon">🔒</p>
      <h2><img class="h-img" src="images/h-gate.png?v=2" alt="LINEアプリからご利用ください"></h2>
      <p>このページは公式LINEのトークからのみご利用いただけます。<br>スマートフォンの方は下のボタンからLINEで開けます。</p>
      <a class="primary-btn" href="https://liff.line.me/2010931633-3uzRGseS">LINEで開く</a>
    </div>
  </section>

  <!-- 免責事項の同意ポップアップ -->
  <div id="disclaimer-overlay" class="hidden">
    <div id="disclaimer-card">
      <h2><img class="h-img" src="images/h-agree.png?v=2" alt="ご利用の前に"></h2>
      <p>ご紹介する製品につきましては、<b>動作保証を行うものではございません</b>。ご利用環境や機器構成によって動作状況が異なる場合があるため、あくまで参考情報としてご確認いただけますと幸いです。</p>
      <p>ケーブル等をご購入の際は、お手元の取扱説明書やメーカーサイトもあわせてご確認ください。</p>
      <p class="soft">診断結果に不安がある場合は、結果画面の相談ボタンからお気軽にご相談ください。確認してお返事します。</p>
      <label id="agree-label"><input type="checkbox" id="agree-check"> 上記を理解し、自己責任で利用します</label>
      <button id="agree-btn" class="primary-btn" disabled>診断を始める</button>
    </div>
  </div>

  <main id="app" class="hidden">

    <!-- 完成図（常設サマリー帯）。選ぶたびにここが埋まっていく -->
    <div id="strip">
      <h1 class="strip-title"><img class="h-img" src="images/h-title.png?v=2" alt="機器接続サポート"></h1>
      <div class="strip-row">

        <button class="slot" id="slot-device" type="button">
          <span class="slot-badge">1</span>
          <span class="slot-art"></span>
          <span class="slot-label">デバイス</span>
        </button>

        <div class="cable" id="cable">
          <button class="plug" id="plug-l" type="button"></button>
          <span class="cable-line"></span>
          <button class="plug" id="plug-r" type="button"></button>
        </div>

        <button class="slot" id="slot-kb" type="button">
          <span class="slot-badge">2</span>
          <span class="slot-art"></span>
          <span class="slot-label">ピアノ</span>
        </button>

      </div>
    </div>

    <!-- 今の質問。尻尾が上の該当スロットを指す -->
    <section id="panel">
      <div id="panel-body"></div>
    </section>

  </main>

  <footer>
    <p id="liff-status"></p>
  </footer>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="shared/catalog.js?v=1"></script>
  <script src="shared/log.js?v=1"></script>
  <script src="app.js?v=23"></script>
</body>
</html>
